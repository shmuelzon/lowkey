# Debug overlay. Apply with -DOVERLAY_CONFIG="overlay-debug.conf", which is
# additive. Deliberately NOT named prj_debug.conf: Zephyr treats prj_<suffix>.conf
# as a FILE_SUFFIX variant that REPLACES prj.conf, so -DFILE_SUFFIX=debug would
# silently drop every base setting.
#
# ── Console over SEGGER RTT (SWD back-channel) ───────────────────────
# No wired debug UART on this board; the debugger's RTT channel carries the
# console and logging. SERIAL stays off — no UARTE is enabled.
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_NCS_BOOT_BANNER=y

# ── Logging ──────────────────────────────────────────────────────────
# Minimal mode routes log output through printk → the RTT console, so no
# separate log backend is needed.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ── Debug ────────────────────────────────────────────────────────────
CONFIG_ASSERT_VERBOSE=y
CONFIG_ASSERT_NO_FILE_INFO=n
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

CONFIG_RESET_ON_FATAL_ERROR=n
