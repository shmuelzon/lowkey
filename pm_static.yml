# Partition Manager static layout.
#
#   0x000000  mcuboot              72 KiB
#   0x012000  mcuboot_pad           2 KiB
#   0x012800  app                 810 KiB
#   0x0DD000  mcuboot_secondary   572 KiB  (70.4 % of primary)
#   0x16C000  factory_data          4 KiB
#   0x16D000  settings_storage     64 KiB
#   0x17D000  (end of reclaimed cpuapp RRAM)
#
# The map spans 1524 KiB, not the 1428 KiB nrf54l15.dtsi gives cpuapp: every
# image widens cpuapp_rram to reclaim the unused FLPR coprocessor's 96 KiB.
# Drop that override from any image and this file no longer fits flash_primary
# and the build fails.
#
# The secondary slot is smaller than the primary because MCUboot
# compressed-image DFU (LZMA) stages a smaller image, which buys the
# application ~116 KiB over an even split.
#
# None of these boundaries can be changed after units ship: MCUboot is the
# immutable first-stage bootloader with the slot offsets compiled into its own
# pm_config.h, and a DFU can only replace a slot's contents. Hence the
# deliberate sizing —
#   * mcuboot 72 KiB: the image is ~58 KiB and pulls in an LZMA decompressor,
#     so 64 KiB left almost no slack for an SDK bump.
#   * settings_storage 64 KiB: ZMS reserves a sector for garbage collection, so
#     16 sectors give ~60 KiB usable against a 12-14 KiB live set (Matter
#     fabrics, OpenThread, PSA ITS and BLE bonds all share it). The low
#     occupancy is the point — it keeps GC write amplification near 1, which
#     matters for RRAM wear.
#   * No unallocated tail: the region above mcuboot_secondary is the only part
#     an application update could ever redraw, and doing so would mean
#     migrating a live ZMS store in place on a door lock.

mcuboot:
  address: 0x0
  region: flash_primary
  size: 0x12000

mcuboot_pad:
  address: 0x12000
  region: flash_primary
  size: 0x800

app:
  address: 0x12800
  region: flash_primary
  size: 0xCA800

mcuboot_primary:
  orig_span: &id001
  - mcuboot_pad
  - app
  span: *id001
  address: 0x12000
  region: flash_primary
  size: 0xCB000

mcuboot_primary_app:
  orig_span: &id002
  - app
  span: *id002
  address: 0x12800
  region: flash_primary
  size: 0xCA800

mcuboot_secondary:
  address: 0xDD000
  orig_span: &id003
  - mcuboot_secondary_pad
  - mcuboot_secondary_app
  span: *id003
  region: flash_primary
  size: 0x8F000

mcuboot_secondary_pad:
  address: 0xDD000
  region: flash_primary
  size: 0x800

mcuboot_secondary_app:
  address: 0xDD800
  region: flash_primary
  size: 0x8E800

factory_data:
  address: 0x16C000
  region: flash_primary
  size: 0x1000

settings_storage:
  address: 0x16D000
  region: flash_primary
  size: 0x10000
