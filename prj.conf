# ── Core System ──────────────────────────────────────────────────────
CONFIG_I2C=y
# Without this the vregmain DCDC mode in devicetree is silently ignored.
CONFIG_REGULATOR=y

# ── Power Management ─────────────────────────────────────────────────
# PM_DEVICE_RUNTIME is what makes i2c30's zephyr,pm-device-runtime-auto take
# effect. Without it the TWIM is resumed once at boot and never suspended
# again, so the i2c30_sleep pinctrl state is applied only during init.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Reference-counted constant-latency requests, shared with MPSL.
CONFIG_NRF_SYS_EVENT=y

# Powers down whole 32 KiB SRAM sections above the image. Driven from main():
# the library's own SYS_INIT needs newlib, and Matter forces picolibc.
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# ── Serial / Console — disabled for release ──────────────────────────
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_NCS_BOOT_BANNER=n
# Unmasked once NCS_BOOT_BANNER is off, so it has to be turned off too.
CONFIG_BOOT_BANNER=n

# ── Logging / shell / debug — disabled for release ───────────────────
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_SHELL=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_THREAD_NAME=n

# ── Watchdog ─────────────────────────────────────────────────────────
# Task watchdog: one channel per critical thread, with the hardware watchdog
# as the fallback if the task watchdog itself stops running.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y

# ── DFU ──────────────────────────────────────────────────────────────
# Needed explicitly for a BLE-only build: MCUMGR_GRP_IMG does not select them,
# and the Matter symbols that do are absent. Without them the SMP image group
# has no back end and the build warns about unsatisfied MCUboot DFU symbols.
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# ── Flash / Settings ─────────────────────────────────────────────────
# ZMS is set explicitly because a BLE-only build has nothing to select it —
# Matter only implies it.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y
CONFIG_SETTINGS=y

# ── Stack / Memory ───────────────────────────────────────────────────
# 6144 is what Matter asks for; server init runs on the main thread.
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=8192

# sys_reboot() is called directly on the factory-reset and init-failure paths,
# so this cannot be left to whatever happens to select it.
CONFIG_REBOOT=y

# ── Build ────────────────────────────────────────────────────────────
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_RESET_ON_FATAL_ERROR=y
