# Set unconditionally: sysbuild's Kconfig cannot see the application's, so this
# cannot be keyed off CONFIG_LOCK_RADIO_MATTER. It gates build-time factory data
# (left off in favour of scripts/generate_factory_data.py) and the matter.ota
# artifact, so a CONFIG_LOCK_RADIO_MATTER=n build emits a matter.ota nobody
# wants unless -DSB_CONFIG_MATTER=n is passed too.
SB_CONFIG_MATTER=y

# ── MCUboot ──────────────────────────────────────────────────────────
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# Overwrite-only is required for compressed images; LZMA is applied at build
# time and MCUboot decompresses into the primary slot.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
SB_CONFIG_MCUBOOT_COMPRESSED_IMAGE_SUPPORT=y

# Images are signed with MCUboot's *public* development key unless this is
# overridden. Anyone can produce an image such a bootloader will accept, and the
# key cannot be changed after units ship, so set it for anything but a test
# build — see the security section of README.md.
#
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/absolute/path/to/prod-ed25519.pem"
