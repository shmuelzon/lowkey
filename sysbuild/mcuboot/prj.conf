# This file REPLACES bootloader/mcuboot/boot/zephyr/prj.conf rather than adding
# to it — sysbuild makes this directory MCUboot's APPLICATION_CONFIG_DIR — so
# the settings copied from it below are load-bearing, not redundant.

CONFIG_PM=n
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_PICOLIBC=y
# Otherwise the arena takes every remaining byte of SRAM.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

CONFIG_FLASH=y
CONFIG_BOOT_ENCRYPT_IMAGE=n

# The default of 128 is below the 203 sectors of the 812 KiB primary slot, and
# BOOT_MAX_IMG_SECTORS_AUTO does not apply under Partition Manager.
CONFIG_BOOT_MAX_IMG_SECTORS=256

# Forced off: fprotect_rram.c caps a protected region at two 31 KiB RRAM
# regions (62 KiB) and the mcuboot partition is 72 KiB, so fprotect_area()
# would fail and MCUboot halts on that. The cost is that the bootloader is not
# write-protected at runtime; shrinking mcuboot below 62 KiB is the only way to
# have both.
CONFIG_FPROTECT=n

# No console is reachable — the board enables no UART — so a log backend would
# be pure flash cost in a partition that can never be resized.
CONFIG_LOG=n
